<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320"
     role="img" aria-label="Swiss Neo-Monolith — cross-medium design system by Okan Öztürk">
  <title>Swiss Neo-Monolith</title>

  <!-- Titanium bone canvas. Zero radius, flat fill, structural rules only. -->
  <rect width="1200" height="320" fill="#f2f4f3"/>

  <g stroke="#121316" stroke-opacity="0.15" stroke-width="1" shape-rendering="crispEdges">
    <line x1="64" y1="96"  x2="1136" y2="96"/>
    <line x1="64" y1="248" x2="1136" y2="248"/>
  </g>

  <line x1="493" y1="96" x2="493" y2="248" stroke="#121316" stroke-opacity="0.15"
        stroke-width="1" shape-rendering="crispEdges"/>

  <text x="64" y="72" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="14" font-weight="700" letter-spacing="1.12" fill="#047857">00 //</text>
  <text x="124" y="72" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="14" font-weight="700" letter-spacing="1.12" fill="#4b5563">DESIGN SYSTEM</text>
  <text x="1136" y="72" text-anchor="end"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="14" font-weight="700" letter-spacing="1.12" fill="#4b5563">REV 1.0.1</text>

  <rect x="64" y="140" width="4" height="60" fill="#10b981"/>

  <text x="88" y="176" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.8" fill="#121316">SWISS</text>
  <text x="88" y="228" font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1.8" fill="#121316">NEO-MONOLITH</text>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
     font-size="13" font-weight="700" letter-spacing="1.04" fill="#4b5563">
    <text x="533" y="132">01  WEB</text>
    <text x="533" y="156">02  APPLICATIONS</text>
    <text x="533" y="180">03  PRINT &amp; PDF</text>
    <text x="533" y="204">04  OFFICE</text>
    <text x="533" y="228">05  TERMINAL</text>
  </g>
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
     font-size="13" font-weight="700" letter-spacing="1.04" fill="#4b5563">
    <text x="800" y="132">06  DATA VISUALIZATION</text>
    <text x="800" y="156">07  BRAND ASSETS</text>
  </g>
  <rect x="800" y="176" width="8" height="8" fill="#059669"/>
  <text x="820" y="184" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="13" font-weight="700" letter-spacing="1.04" fill="#047857">ONE LANGUAGE</text>

  <text x="64" y="284" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="13" font-weight="400" letter-spacing="1.04" fill="#4b5563">OKAN ÖZTÜRK · JOXINYKS.COM</text>
  <text x="1136" y="284" text-anchor="end"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="13" font-weight="700" letter-spacing="1.04" fill="#047857">STATUS: OPERATIONAL</text>
</svg>
